// Этот конфиг выполняется при загрузке плагина MatchZy
// Не добавляйте команды, кроме конфигурационных переменных matchzy
// Больше настроек и переменных появится в будущих обновлениях.

// Включен ли whitelist по умолчанию. Значение по умолчанию: false
// Это значение по умолчанию, админ может переключать whitelist командой .whitelist
matchzy_whitelist_enabled_default false

// Включен ли knife-раунд по умолчанию. Значение по умолчанию: true
// Это значение по умолчанию, админ может переключать knife командой .roundknife
matchzy_knife_enabled_default true

// Минимальное число готовых игроков для старта матча. Если 0, то готовы должны быть все подключенные игроки. Значение по умолчанию: 2
matchzy_minimum_ready_required 2

// Автоматически ли запускать запись демо при переходе матча в live. Значение по умолчанию: true
matchzy_demo_recording_enabled true

// Путь к папке, куда будут сохраняться демо. Если задан, не должен начинаться со слеша и должен заканчиваться слешем. Пустая строка = корень csgo.
// Пример: matchzy_demo_path MatchZy/
// Папка MatchZy будет создана в папке csgo, если ее нет, и демо будут сохраняться туда. Значение по умолчанию: MatchZy/ (демо хранятся в MatchZy/)
matchzy_demo_path MatchZy/

// Формат имени демо. Можно использовать {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1} и {TEAM2}
// Имена демо-файлов будут сформированы по указанному шаблону. Не добавляйте .dem, он подставится автоматически
// Рекомендуется оставлять {TIME}, чтобы имя демо всегда было уникальным.
matchzy_demo_name_format "{TIME}_{MATCH_ID}_{MAP}_{TEAM1}_vs_{TEAM2}"

// Включена ли команда !stop/.stop по умолчанию. Значение по умолчанию: false
// Примечание: используется система бэкапов Valve для записи и восстановления раундов. В большинстве случаев этого достаточно.
// Но в некоторых случаях это может быть ненадежно, поэтому по умолчанию установлено false
matchzy_stop_command_available false

// Становится ли команда stop недоступной, если игрок нанес урон игроку противоположной команды. Значение по умолчанию: false
matchzy_stop_command_no_damage false

// Использовать !pause/.pause как тактическую паузу или как обычную (снятие только когда обе команды используют unpause, админ может снять принудительно)
// Значение по умолчанию: false
matchzy_use_pause_command_for_tactical_pause false

// Оставлять ли команду .tech включенной
// Значение по умолчанию: true
matchzy_enable_tech_pause true

// Флаг, необходимый для использования tech pause. Пусто — доступно всем
// Значение по умолчанию: ""
matchzy_tech_pause_flag ""

// Длительность tech pause в секундах. Установите -1 для бесконечной паузы.
// Значение по умолчанию: 300
matchzy_tech_pause_duration 300

// Максимально допустимое количество tech pause.
// Значение по умолчанию: 2
matchzy_max_tech_pauses_allowed 2

// Ставить ли матч на паузу после восстановления раунда. Значение по умолчанию: true
// Игроки/админы могут снять паузу через !unpause/.unpause. (Для игроков команду должны ввести обе команды)
matchzy_pause_after_restore true

// Префикс в чате для сообщений MatchZy. Значение по умолчанию: [{Green}MatchZy{Default}]
// Доступные цвета: {Default}, {Darkred}, {Green}, {LightYellow}, {LightBlue}, {Olive}, {Lime}, {Red}, {Purple}, {Grey}, {Yellow}, {Gold}, {Silver}, {Blue}, {DarkBlue}
// {BlueGrey}, {Magenta} и {LightRed}. Добавляйте {Default} в конце префикса, чтобы не окрашивать все сообщение цветом префикса.
matchzy_chat_prefix [{Green}MatchZy{Default}]

// Префикс в чате, когда админ отправляет сообщение через .asay <message>. Значение по умолчанию: [{Red}ADMIN{Default}]
// Доступные цвета перечислены выше
matchzy_admin_chat_prefix [{Red}ADMIN{Default}]

// Задержка в секундах перед отправкой напоминаний от MatchZy (например, об unready, паузе и т.д.).
// Значение по умолчанию: 13 (потому что каждое сообщение держится в чате ~13 секунд)
// Примечание: изменение этого таймера не повлияет на уже активный таймер; если меняете настройку во время warmup, перезапустите warmup для применения
matchzy_chat_messages_timer_delay 13

// Включен ли playout (игра максимума раундов). Значение по умолчанию: false
// Это значение по умолчанию, админ может переключать playout командой .playout
matchzy_playout_enabled_default false

// Кикать ли всех клиентов и запрещать вход на сервер, если матч не загружен. Значение по умолчанию: false
// Это значит, что в match-режиме матч должен быть загружен через matchzy_loadmatch/matchzy_loadmatch_url
// На сервер смогут зайти только игроки из этого матча, остальные будут кикнуты
matchzy_kick_when_no_match_loaded false

// Восстанавливать ли параметры из секции cvars к исходным значениям после окончания серии.
// Значение по умолчанию: true
matchzy_reset_cvars_on_series_end true

// Если задано, записанные демо будут загружаться на этот URL после окончания карты
matchzy_demo_upload_url ""

// Какой режим плагин загрузит при старте: матч, практика или никакой.
// 0 - никакой, 1 - match mode, 2 - practice mode. Значение по умолчанию: 1
matchzy_autostart_mode 1

// Сохранять ли гранаты глобально по умолчанию, а не привязывать к конкретным игрокам. Значение по умолчанию: false
matchzy_save_nades_as_global_enabled false

// Включен ли force ready через !forceready (сейчас работает только в Match Setup). Значение по умолчанию: true
matchzy_allow_force_ready true

// Максимальное число записей истории гранат на карту и на клиента. Установите 0, чтобы отключить лимит и разрешить неограниченное сохранение. Значение по умолчанию: 512
matchzy_max_saved_last_grenades 512

// Включен ли индивидуальный цвет дыма для игрока. Значение по умолчанию: false
matchzy_smoke_color_enabled false

// Если true, все игроки получат права администратора. Значение по умолчанию: false
matchzy_everyone_is_admin false

// Показывать ли сообщение 'MatchZy Plugin by WD-' при старте матча. Значение по умолчанию: true
matchzy_show_credits_on_match_start true

// Формат имени сервера (hostname). Установите "" для отключения/использования текущего.
matchzy_hostname_format "MatchZy | {TEAM1} vs {TEAM2}"

// Показывать ли отчет по урону после каждого раунда. Значение по умолчанию: true.
matchzy_enable_damage_report true

// Сообщение, которое показывается при старте матча. Используйте $$$ для переноса на несколько строк. Установите "" для отключения.
// Доступные переменные: {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1}, {TEAM2}, {TEAM1_SCORE}, {TEAM2_SCORE}
// Доступные цвета: {Default}, {Darkred}, {Green}, {LightYellow}, {LightBlue}, {Olive}, {Lime}, {Red}, {Purple}, {Grey}, {Yellow}, {Gold}, {Silver}, {Blue}, {DarkBlue}
// Пример: {Green} Welcome to the server! {Default} $$$ Agent models are not allowed and may lead to {Red}disqualification!{Default}
matchzy_match_start_message ""
