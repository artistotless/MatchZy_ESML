name: Deploy to Servers

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "documentation/**"
      - "*.md"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Publish
        run: dotnet publish -o publish/MatchZy

      - name: Create MatchZy.tar.gz
        run: tar czf MatchZy.tar.gz -C publish/MatchZy .

      - name: Deploy to servers
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SERVERS: ${{ vars.DEPLOY_SERVERS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "$DEPLOY_SERVERS" | jq -c '.[]' | while read -r server; do
            host=$(echo "$server" | jq -r '.host')
            port=$(echo "$server" | jq -r '.port // 22')
            user=$(echo "$server" | jq -r '.user // "root"')
            path=$(echo "$server" | jq -r '.path')
            SSH_CMD="ssh -i ~/.ssh/deploy_key -p $port -o StrictHostKeyChecking=no"

            echo "::group::Deploying to $host:$path"

            ssh-keyscan -p "$port" "$host" >> ~/.ssh/known_hosts 2>/dev/null

            $SSH_CMD "$user@$host" "mkdir -p '$path' && cd '$path' && if ls -A . 2>/dev/null | grep -qvE '^MatchZy(_backup)?\.tar\.gz\$'; then tar czf /tmp/MatchZy_backup.tar.gz --exclude=MatchZy.tar.gz --exclude=MatchZy_backup.tar.gz . && mv -f /tmp/MatchZy_backup.tar.gz '$path/MatchZy_backup.tar.gz' && echo 'Backup created'; else echo 'No files to backup'; fi && rm -f MatchZy.tar.gz"

            scp -i ~/.ssh/deploy_key -P "$port" -o StrictHostKeyChecking=no \
              MatchZy.tar.gz "$user@$host:$path/MatchZy.tar.gz"

            echo "Uploaded MatchZy.tar.gz to $host:$path/MatchZy.tar.gz"
            echo "::endgroup::"
          done

          rm -f ~/.ssh/deploy_key
