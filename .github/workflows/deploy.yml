name: Create Server Release

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "documentation/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Publish
        run: dotnet publish -o publish/MatchZy /p:SourceRevisionId=$(git rev-parse --short HEAD)

      - name: Create MatchZy.tar.gz
        run: tar czf MatchZy.tar.gz -C publish/MatchZy .

      - name: Prepare release metadata
        id: metadata
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          TAG_NAME="server-build-${BRANCH_NAME}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_NAME="Server Build ${BRANCH_NAME} #${GITHUB_RUN_NUMBER} (${SHORT_SHA})"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          name: ${{ steps.metadata.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ github.ref_name == 'dev' }}
          files: |
            MatchZy.tar.gz
